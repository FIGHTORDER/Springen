[workspace]
resolver = "2"
members = [
    "crates/springen-core",
    "crates/springen-smf",
    "crates/springen-archive",
    "crates/springen-cli",
    "crates/springen-app",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/QrowZK/springen"

[workspace.dependencies]
springen-core = { path = "crates/springen-core" }
springen-smf = { path = "crates/springen-smf" }
springen-archive = { path = "crates/springen-archive" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
